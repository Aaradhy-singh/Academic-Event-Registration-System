<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Academic Event Registration System</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header id="topbar" class="noprint" style="display:none">
  <h1>Academic Event Registration System</h1>
  <nav>
    <span id="navStudent">
      <button onclick="showEvents()">Browse Events</button>
      <button onclick="showMyRegs()">My Registrations</button>
    </span>
    <span id="navOrg">
      <button onclick="showEvents()">Manage Events</button>
      <button onclick="showReports()">Reports</button>
    </span>
  </nav>
  <div id="userBox">
    <p id="welcome"></p>
    <button onclick="logout()">Log out</button>
  </div>
</header>

<main>

  <!-- Login page -->
  <section class="page" id="pageLogin">
    <form class="box" onsubmit="return login()">
      <h2>Sign in</h2>
      <label for="loginName">Full name</label>
      <input type="text" id="loginName" required minlength="3">
      <label for="loginReg">Registration number (8 digits)</label>
      <input type="text" id="loginReg" required pattern="[0-9]{8}" title="Enter your 8 digit registration number">
      <label for="loginRole">Role</label>
      <select id="loginRole">
        <option value="student">Student</option>
        <option value="organizer">Organizer</option>
      </select>
      <button class="main" type="submit">Continue</button>
    </form>
  </section>

  <!-- Events page -->
  <section class="page" id="pageEvents">
    <h2 id="eventsTitle">Events</h2>
    <button class="main" id="createBtn" onclick="openEventForm(0)">Create Event</button>
    <div id="reminders"></div>

    <form class="box" id="eventForm" style="display:none" onsubmit="return saveEvent()">
      <h3 id="formTitle">Event</h3>
      <label for="evTitle">Title</label>
      <input type="text" id="evTitle" required minlength="5">
      <label for="evCategory">Category</label>
      <select id="evCategory">
        <option>Seminar</option>
        <option>Workshop</option>
        <option>Fest</option>
        <option>Hackathon</option>
      </select>
      <label for="evDate">Date</label>
      <input type="date" id="evDate" required>
      <label for="evTime">Time</label>
      <input type="time" id="evTime" required>
      <label for="evVenue">Venue</label>
      <input type="text" id="evVenue" required>
      <label for="evCapacity">Seat limit</label>
      <input type="number" id="evCapacity" min="1" max="1000" required>
      <label for="evDesc">Description</label>
      <textarea id="evDesc" rows="3" required></textarea>
      <button class="main" type="submit">Save Event</button>
      <button type="button" onclick="document.getElementById('eventForm').style.display = 'none'">Cancel</button>
    </form>

    <p>
      <button id="tabUpcoming" onclick="setFilter('upcoming')">Upcoming Events</button>
      <button id="tabRecent" onclick="setFilter('recent')">Recent Events</button>
      <button id="tabAll" onclick="setFilter('all')">All Events</button>
    </p>
    <div class="grid" id="eventList"></div>
  </section>

  <!-- My registrations page (student) -->
  <section class="page" id="pageMy">
    <div class="box" id="popup" style="display:none"></div>
    <h2 class="noprint">My Registrations</h2>
    <div class="grid noprint" id="myList"></div>
  </section>

  <!-- Attendees page (organizer) -->
  <section class="page" id="pageAttendees">
    <button onclick="showEvents()">Back to Events</button>
    <h2 id="attTitle"></h2>
    <p id="attInfo"></p>
    <form onsubmit="return scanTicket()">
      <label for="scanCode">Scan or type ticket code</label>
      <input type="text" id="scanCode" placeholder="TKT-123456" required>
      <button class="main" type="submit">Mark Present</button>
    </form>
    <div style="overflow-x:auto">
      <table>
        <caption>Attendee list</caption>
        <tr><th>Name</th><th>Reg. No.</th><th>Ticket</th><th>Status</th><th>Action</th></tr>
        <tbody id="attBody"></tbody>
      </table>
    </div>
  </section>

  <!-- Reports page (organizer) -->
  <section class="page" id="pageReports">
    <h2>Reports</h2>
    <p id="reportTotals"></p>
    <div style="overflow-x:auto">
      <table>
        <caption>Event-wise summary</caption>
        <tr><th>Event</th><th>Registered</th><th>Attended</th><th>Attendance %</th><th>Avg. rating</th></tr>
        <tbody id="reportBody"></tbody>
      </table>
    </div>
    <h3>Feedback received</h3>
    <div id="feedbackList"></div>
  </section>

</main>

<footer class="noprint">
  <p>Academic Event Registration System | CSE326 CA1 | Team A2O Solutions</p>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="script.js"></script>
</body>
</html>
